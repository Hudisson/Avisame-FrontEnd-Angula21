<section class="task-form">

  <h1>Criar evento</h1>

  <p class="descricao">
    Preencha os dados para criar um novo evento.
  </p>

  @if (erro()) {
  <div class="mensagem erro">
    {{ erro() }}
  </div>
  }

  @if (sucesso()) {
  <div class="mensagem sucesso">
    {{ sucesso() }}
  </div>
  }

  <form (submit)="$event.preventDefault(); criarEvento()">

    <div class="campo">
      <label for="titulo">Título</label>

      <input type="text" id="titulo" name="titulo" placeholder="Digite o título do evento" [value]="titulo()"
        (input)="titulo.set($any($event.target).value)">
    </div>

    <div class="campo">
      <label for="descricao">Descrição</label>

      <editor id="descricao" name="descricao" [init]="editorConfig" (onChange)="onEditorChange($event)"
        (onInput)="onEditorChange($event)" (onUndo)="onEditorChange($event)" (onRedo)="onEditorChange($event)">
      </editor>
    </div>

    <div class="campo">
      <label for="eventDate">Data do evento</label>

      <input type="date" id="eventDate" name="eventDate" [value]="dataDoEvento()"
        (input)="dataDoEvento.set($any($event.target).value)">
    </div>

    <button type="submit" [disabled]="salvando()">
      {{ salvando() ? 'Criando...' : 'Criar evento' }}
    </button>

  </form>

</section>
