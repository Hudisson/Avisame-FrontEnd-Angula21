<div class="menu-sidebar">
  <ul>
    <li>
      <a routerLink="/home" routerLinkActive="active" class="btn-home">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>
    </li>

    <li>
      <a routerLink="/home/perfil" routerLinkActive="active" class="btn-perfil">
        <i class="fa-solid fa-user"></i>
        <span>Perfil</span>
      </a>
    </li>

    <li class="li-agenda">
      <span class="span-agenda" (click)="toggleAgenda()">
        <span>
          <i
            class="fa-solid"
            [class.fa-circle-chevron-down]="!agendaAberta"
            [class.fa-circle-chevron-up]="agendaAberta">
          </i>
          Agenda
        </span>
      </span>

      <ul class="ul-agenda" [class.ativo]="agendaAberta">
        <li>
          <a routerLink="/home/tarefas" routerLinkActive="active">
            <i class="fa-solid fa-list-check"></i>
             <span>Atividade diária</span>
          </a>
        </li>

        <li>
          <a routerLink="/home/eventos" routerLinkActive="active">
            <i class="fa-solid fa-calendar-days"></i>
            <span>Eventos</span>
          </a>
        </li>

        <li>
          <a routerLink="/home/horarios" routerLinkActive="active">
            <i class="fa-solid fa-clock"></i>
            <span>Definir horário</span>
          </a>
        </li>

      </ul>
    </li>

    <li>
      <a routerLink="/logout" routerLinkActive="active" class="btn-sair">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Sair</span>
      </a>
    </li>
  </ul>
</div>
